name: HotelFinance CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hotel_user:hotel_password@localhost:5432/hotel_finance?schema=public
      AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
